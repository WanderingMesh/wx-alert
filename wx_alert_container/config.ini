# wx-alert configuration
#
# This file is copied into the Docker image at /app/config.ini.
# Edit it before building the image. You may also override it at runtime by
# bind-mounting another file over /app/config.ini.

[weather]
# Geographic point monitored for weather alerts.
DEFAULT_LATITUDE = 39.5296 
DEFAULT_LONGITUDE = -119.8138

# Additional NWS zones to query, comma-separated. Optional.
#
# The county containing the point above is resolved automatically at startup
# and always queried, so this may be left blank. Add the neighbouring counties
# a wide-area mesh reaches into, since RF coverage does not stop at a county
# line. Find a county's code with:
#
#   curl -s https://api.weather.gov/points/39.5296,-119.8138 | grep county
#
# Use county codes (NVC031), not forecast zone codes (NVZ003). The two look
# alike and both are accepted by the API, but a forecast zone returns only
# zone-based products: Tornado, Severe Thunderstorm, and Flash Flood Warnings
# are county-based and would silently never arrive.
ZONES =

# Discard a warning whose polygon is farther than this many kilometres from
# the point above. 0 disables the test.
#
# Alerts are fetched by county because that is the only query form that
# returns storm-based warnings at all. Counties are not a uniform size, though:
# Washoe NV is 315 km from Reno to the Oregon border, while Arlington VA is
# 12 km across. Without this radius, the same config file would mean something
# completely different depending on where it runs.
#
# Watches, advisories, and statements are issued to a whole zone rather than a
# polygon. They have no geometry to measure and are always kept.
ALERT_RADIUS_KM = 50

[ntfy]
# Required when the container is run with --ntfy or --ntfy-test.
# For ntfy.sh, use a long, unguessable topic name.
#
# WARNING: An ntfy topic name is effectively a bearer secret. Anyone who knows
# it can both read and publish to it. Leave this blank in the tracked template
# and supply the real topic through a runtime-mounted config file.
TOPIC =

# Optional. Blank means https://ntfy.sh
SERVER =

# Optional bearer token for a protected ntfy topic. Blank means no token.
# WARNING: A token baked into an image can be recovered by anyone who has
# access to that image. Prefer a runtime-mounted config for secret tokens.
TOKEN =

# Optional base tags, comma-separated. Blank means no base tags.
#
# The product class (warning, watch, advisory, statement, outlook, other) is
# derived from each alert and appended automatically. Any class tag listed
# here is stale by definition and is dropped before the correct one is added,
# so a Flood Watch is never tagged as a warning.
#
#   Flash Flood Warning -> WX-Alert-RNO,warning
#   Flood Watch         -> WX-Alert-RNO,watch
#   Wind Advisory       -> WX-Alert-RNO,advisory
TAGS = WX-Alert-RNO

# Optional priority.
# Possible values:
#   auto     Product-aware mapping. The product class is considered first and
#            CAP severity only breaks ties within a class, which keeps the
#            loudest priorities for events that are actually happening:
#              Emergency         -> max
#              Warning           -> max if Extreme/Severe, otherwise high
#              Watch             -> high if Extreme/Severe, otherwise default
#              Advisory          -> default
#              Statement/Outlook -> low
#   min      ntfy priority 1
#   low      ntfy priority 2
#   default  ntfy priority 3
#   high     ntfy priority 4
#   max      ntfy priority 5
#   urgent   Alias for max
#
# Note: a fixed value such as "max" sends every product at the same priority,
# including statements and outlooks. "auto" is recommended.
PRIORITY = auto

[delivery]
# Delay between separate notifications when multiple NWS alerts are active.
# Valid range: 1 through 60 seconds.
DELAY_SECONDS = 5

# Check interval - how often the script runs to check for new updates.
# Range: 5-3600 seconds. Default: 3600.
CHECK_INTERVAL = 300

# On the first cycle after a container start, do not send a watch, advisory,
# statement, outlook, or other product older than this many seconds.
#
# The NWS API returns every currently *active* alert, not only newly issued
# ones, so without this a restart looks identical to a burst of new alerts and
# a watch issued eight hours ago would be announced as though it just arrived.
# Set to 0 to disable.
STARTUP_MAX_AGE_SECONDS = 900

# Active warnings bypass STARTUP_MAX_AGE_SECONDS, because silently suppressing
# an ongoing warning is more dangerous than sending a duplicate.
ALWAYS_NOTIFY_WARNINGS_ON_STARTUP = true

# Exit non-zero once a transport has failed this many consecutive cycles.
#
# This exists to recover a USB radio that was unplugged and plugged back in.
# The container still holds the original device node, which no longer exists,
# and no amount of reconnecting inside the process will fix it. Exiting lets
# the compose restart policy recreate the container against the current
# device. At the default CHECK_INTERVAL of 300 seconds, 10 cycles is roughly
# 50 minutes. Set to 0 to never exit.
EXIT_AFTER_FAILED_CYCLES = 10

[state]
# Persistent delivery history, recorded per transport.
#
# Without this, deduplication lives only in memory and every container restart
# re-notifies every active alert. Mount /data as a Docker volume so the history
# survives container replacement, not just a stop and start.
STATE_FILE = /data/notified-alerts.json

# Discard delivery records older than this. Range: 1-365 days.
RETENTION_DAYS = 14

[meshcore]
# Broadcast alerts to a MeshCore channel through a USB-attached companion
# radio, for delivery over LoRa when the internet is unavailable.
#
# Airtime here is a shared resource, not free bandwidth. Every channel message
# is flood-routed and rebroadcast by every repeater in range, so it occupies
# the channel for everyone nearby. The defaults below are deliberately
# conservative for that reason.
ENABLED = false

# Serial device for the companion radio.
#
# Use a /dev/serial/by-id/ path rather than /dev/ttyACM0 or /dev/ttyUSB0:
# USB enumeration order changes across reboots, and a bare device node will
# eventually point at something else. List candidates on the host with:
#
#   ls -l /dev/serial/by-id/
#
# This must be the path as seen *inside* the container. See docker-compose.yml,
# which maps the host device to /dev/meshcore.
PORT = /dev/meshcore

BAUD = 115200

# Channel index to broadcast on. Index 0 is the default public channel on most
# firmware builds. The channel is read back at startup and its name is logged,
# so a wrong index fails immediately instead of quietly transmitting into the
# wrong place.
CHANNEL_INDEX = 0

# Minimum product class to broadcast, loudest to quietest:
#   warning    Warnings and emergencies only. Recommended.
#   watch      Also watches.
#   advisory   Also advisories.
#   statement  Also special weather statements.
#   outlook    Also outlooks.
#   other      Everything.
MIN_CLASS = warning

# Minimum CAP severity to broadcast: extreme, severe, moderate, minor, unknown.
# Both this and MIN_CLASS must be satisfied.
#
# Note that "severe" is stricter than it sounds, because CAP severity is not a
# measure of how bad the weather is. NWS issues Winter Storm, Freeze, and Wind
# Chill Warnings at severity=Moderate, so MIN_CLASS = warning with
# MIN_SEVERITY = severe carries a Tornado Warning and silently drops a Winter
# Storm Warning. Use "moderate" to carry every warning NWS issues.
MIN_SEVERITY = severe

# Minimum seconds between transmissions. The [delivery] DELAY_SECONDS setting
# governs HTTPS notifications, where one second is fine; on LoRa it is not.
#
# This gap is waited out inside the poll cycle, so a county query returning
# several alerts at once puts all of them on the air spaced this far apart,
# rather than one per CHECK_INTERVAL. A value above 120 seconds is deferred to
# the next cycle instead, since holding the cycle open longer than that delays
# the next NWS query.
MIN_SECONDS_BETWEEN_SENDS = 30

# Rolling one-hour cap on transmissions. Set to 0 for no cap.
#
# An alert over the cap is logged at WARNING and offered again on the next
# cycle, for as long as NWS still lists it as active. It is deliberately not
# recorded as handled: a weather alert delivered forty minutes late is worse
# than useless, but permanently discarding a warning because a batch of
# statements arrived first is worse still. Alerts are dispatched loudest first
# so that a cap reached mid-batch sheds the least important products.
MAX_SENDS_PER_HOUR = 12

# First-cycle staleness limit, as in [delivery] but applied to the radio.
# Replaying hours-old products onto a shared channel after every container
# restart costs everyone airtime.
#
# Warnings do not get ntfy's unconditional bypass here. They are judged on
# remaining validity instead: a warning still in force for at least this long
# is broadcast however old it is, and one about to expire is not. That carries
# a Flash Flood Warning issued 50 minutes ago and running for another two hours
# — which is what a restart mid-event looks like — without replaying a backlog
# of expired products.
#
# An alert the radio has already recorded an outcome for is never treated as
# backlog, so a reissue, or a retry after the radio was unreachable, is not
# suppressed by this limit. Override per run with --meshcore-startup-max-age;
# 0 disables the policy, which is what a dry-run preview wants.
STARTUP_MAX_AGE_SECONDS = 900

# Seconds to wait for the radio to answer.
CONNECT_TIMEOUT = 30
SEND_TIMEOUT = 30

# How many times each message is transmitted.
#
# Channel messages are unacknowledged broadcasts. There is no delivery report
# and no way to detect a message that collided with other traffic, so the only
# defence against losing one is to send it again. The cost is that everyone on
# the channel sees the alert twice. Set to 1 to disable.
#
# Remember that this doubles airtime: MAX_SENDS_PER_HOUR counts alerts, not
# transmissions, so 12 alerts per hour at 2 copies is 24 transmissions.
#
# Above 1, each copy is suffixed with a marker: "1/2", "2/2". It tells a
# reader they are seeing one warning rather than two, and it stops a receiver
# that deduplicates on message content from collapsing the copies back into
# one. The marker costs four bytes, taken from the message budget, so alerts
# are trimmed slightly harder when repeats are on.
REPEAT_SENDS = 2

# Random delay range, in seconds, before each repeated copy.
#
# The gap is randomised rather than fixed so that a collision with another
# periodic sender does not simply repeat itself on every copy.
#
# REPEAT_MIN_DELAY must be at least 1 and this is enforced at startup. The
# firmware stamps every message with the current epoch second, and repeaters
# discard flood packets whose hash they have already forwarded. A sub-second
# gap risks two copies sharing a timestamp, which the mesh would drop before
# the differing markers could save them.
REPEAT_MIN_DELAY = 1
REPEAT_MAX_DELAY = 12

# Reboot the radio over its serial control lines when it stops answering.
#
# The companion firmware can hang while the USB device stays present and the
# port still opens. Docker cannot see that, so its restart policy reconnects
# to the same hung radio forever. Pulsing the reset line recovers it in place.
# Run with --meshcore-reset to do this by hand.
HARD_RESET_ON_HANG = true

# Seconds to wait after a reset for the firmware to boot and initialize its
# radio. Reconnecting sooner just fails.
HARD_RESET_SETTLE = 3
