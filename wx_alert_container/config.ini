# wx-alert configuration
#
# This file is copied into the Docker image at /app/config.ini.
# Edit it before building the image. You may also override it at runtime by
# bind-mounting another file over /app/config.ini.

[weather]
# Geographic point monitored by the NWS active-alert API.
DEFAULT_LATITUDE = 39.5296 
DEFAULT_LONGITUDE = -119.8138

[ntfy]
# Required when the container is run with --ntfy or --ntfy-test.
# For ntfy.sh, use a long, unguessable topic name.
#
# WARNING: An ntfy topic name is effectively a bearer secret. Anyone who knows
# it can both read and publish to it. Leave this blank in the tracked template
# and supply the real topic through a runtime-mounted config file.
TOPIC =

# Optional. Blank means https://ntfy.sh
SERVER =

# Optional bearer token for a protected ntfy topic. Blank means no token.
# WARNING: A token baked into an image can be recovered by anyone who has
# access to that image. Prefer a runtime-mounted config for secret tokens.
TOKEN =

# Optional base tags, comma-separated. Blank means no base tags.
#
# The product class (warning, watch, advisory, statement, outlook, other) is
# derived from each alert and appended automatically. Any class tag listed
# here is stale by definition and is dropped before the correct one is added,
# so a Flood Watch is never tagged as a warning.
#
#   Flash Flood Warning -> WX-Alert-RNO,warning
#   Flood Watch         -> WX-Alert-RNO,watch
#   Wind Advisory       -> WX-Alert-RNO,advisory
TAGS = WX-Alert-RNO

# Optional priority.
# Possible values:
#   auto     Product-aware mapping. The product class is considered first and
#            CAP severity only breaks ties within a class, which keeps the
#            loudest priorities for events that are actually happening:
#              Emergency         -> max
#              Warning           -> max if Extreme/Severe, otherwise high
#              Watch             -> high if Extreme/Severe, otherwise default
#              Advisory          -> default
#              Statement/Outlook -> low
#   min      ntfy priority 1
#   low      ntfy priority 2
#   default  ntfy priority 3
#   high     ntfy priority 4
#   max      ntfy priority 5
#   urgent   Alias for max
#
# Note: a fixed value such as "max" sends every product at the same priority,
# including statements and outlooks. "auto" is recommended.
PRIORITY = auto

[delivery]
# Delay between separate notifications when multiple NWS alerts are active.
# Valid range: 1 through 60 seconds.
DELAY_SECONDS = 5

# Check interval - how often the script runs to check for new updates.
# Range: 5-3600 seconds. Default: 3600.
CHECK_INTERVAL = 300

# On the first cycle after a container start, do not send a watch, advisory,
# statement, outlook, or other product older than this many seconds.
#
# The NWS API returns every currently *active* alert, not only newly issued
# ones, so without this a restart looks identical to a burst of new alerts and
# a watch issued eight hours ago would be announced as though it just arrived.
# Set to 0 to disable.
STARTUP_MAX_AGE_SECONDS = 900

# Active warnings bypass STARTUP_MAX_AGE_SECONDS, because silently suppressing
# an ongoing warning is more dangerous than sending a duplicate.
ALWAYS_NOTIFY_WARNINGS_ON_STARTUP = true

# Exit non-zero once a transport has failed this many consecutive cycles.
#
# This exists to recover a USB radio that was unplugged and plugged back in.
# The container still holds the original device node, which no longer exists,
# and no amount of reconnecting inside the process will fix it. Exiting lets
# the compose restart policy recreate the container against the current
# device. At the default CHECK_INTERVAL of 300 seconds, 10 cycles is roughly
# 50 minutes. Set to 0 to never exit.
EXIT_AFTER_FAILED_CYCLES = 10

[state]
# Persistent delivery history, recorded per transport.
#
# Without this, deduplication lives only in memory and every container restart
# re-notifies every active alert. Mount /data as a Docker volume so the history
# survives container replacement, not just a stop and start.
STATE_FILE = /data/notified-alerts.json

# Discard delivery records older than this. Range: 1-365 days.
RETENTION_DAYS = 14

[meshcore]
# Broadcast alerts to a MeshCore channel through a USB-attached companion
# radio, for delivery over LoRa when the internet is unavailable.
#
# Airtime here is a shared resource, not free bandwidth. Every channel message
# is flood-routed and rebroadcast by every repeater in range, so it occupies
# the channel for everyone nearby. The defaults below are deliberately
# conservative for that reason.
ENABLED = false

# Serial device for the companion radio.
#
# Use a /dev/serial/by-id/ path rather than /dev/ttyACM0 or /dev/ttyUSB0:
# USB enumeration order changes across reboots, and a bare device node will
# eventually point at something else. List candidates on the host with:
#
#   ls -l /dev/serial/by-id/
#
# This must be the path as seen *inside* the container. See docker-compose.yml,
# which maps the host device to /dev/meshcore.
PORT = /dev/meshcore

BAUD = 115200

# Channel index to broadcast on. Index 0 is the default public channel on most
# firmware builds. The channel is read back at startup and its name is logged,
# so a wrong index fails immediately instead of quietly transmitting into the
# wrong place.
CHANNEL_INDEX = 0

# Minimum product class to broadcast, loudest to quietest:
#   warning    Warnings and emergencies only. Recommended.
#   watch      Also watches.
#   advisory   Also advisories.
#   statement  Also special weather statements.
#   outlook    Also outlooks.
#   other      Everything.
MIN_CLASS = warning

# Minimum CAP severity to broadcast: extreme, severe, moderate, minor, unknown.
# Both this and MIN_CLASS must be satisfied.
MIN_SEVERITY = severe

# Minimum seconds between transmissions. The [delivery] DELAY_SECONDS setting
# governs HTTPS notifications, where one second is fine; on LoRa it is not.
MIN_SECONDS_BETWEEN_SENDS = 30

# Rolling one-hour cap on transmissions. Alerts over the cap are recorded as
# skipped and logged at WARNING rather than queued, because a weather alert
# delivered forty minutes late is worse than useless. Set to 0 for no cap.
MAX_SENDS_PER_HOUR = 12

# First-cycle staleness limit, as in [delivery] but applied to the radio and
# with no bypass for warnings. Replaying hours-old warnings onto a shared
# channel after every container restart costs everyone airtime.
STARTUP_MAX_AGE_SECONDS = 900

# Seconds to wait for the radio to answer.
CONNECT_TIMEOUT = 30
SEND_TIMEOUT = 30
