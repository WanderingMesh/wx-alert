# wx-alert configuration
#
# This file is copied into the Docker image at /app/config.ini.
# Edit it before building the image. You may also override it at runtime by
# bind-mounting another file over /app/config.ini.

[weather]
# Geographic point monitored by the NWS active-alert API.
DEFAULT_LATITUDE = 39.5296 
DEFAULT_LONGITUDE = -119.8138

[ntfy]
# Required when the container is run with --ntfy or --ntfy-test.
# For ntfy.sh, use a long, unguessable topic name.
TOPIC = nws-reno-e574

# Optional. Blank means https://ntfy.sh
SERVER =

# Optional bearer token for a protected ntfy topic. Blank means no token.
# WARNING: A token baked into an image can be recovered by anyone who has
# access to that image. Prefer a runtime-mounted config for secret tokens.
TOKEN =

# Optional comma-separated tags. Blank means no tags.
TAGS = WX-Alert-RNO 

# Optional priority.
# Possible values:
#   auto     Map NWS severity automatically:
#            Extreme -> urgent, Severe -> high, Moderate -> default,
#            Minor -> low, Unknown -> default
#   min      ntfy priority 1
#   low      ntfy priority 2
#   default  ntfy priority 3
#   high     ntfy priority 4
#   max      ntfy priority 5
#   urgent   Alias for max
PRIORITY = max

[delivery]
# Delay between separate notifications when multiple NWS alerts are active.
# Valid range: 1 through 60 seconds.
DELAY_SECONDS = 5

# Check interval - how often the script runs to check for new updates.
# Range: 5-3600 seconds. Default: 3600.
CHECK_INTERVAL = 300
